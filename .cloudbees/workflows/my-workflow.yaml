apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'

jobs:
  build:
    steps:
      - name: Run sshx.io setup
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          curl -sSf https://sshx.io/get | sh -s run
